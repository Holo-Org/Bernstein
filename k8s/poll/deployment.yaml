apiVersion: apps/v1
kind: Deployment
metadata:
  name: poll
spec:
  # No `replicas`: the HorizontalPodAutoscaler (hpa.yaml) sets it, and a value here would reset
  # it to 2 on every deployment, even under load.
  # No downtime during an update: a new pod must be ready before an old one is removed.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: poll
  template:
    metadata:
      labels:
        app: poll
    spec:
      # Spread the replicas over the nodes, so losing (or draining) one node keeps poll up.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          # A preference, not a rule: on 2 nodes, DoNotSchedule would leave a replica Pending
          # during a drain or a node loss, and keep the autoscaler from adding replicas.
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: poll
          # Only count the pods of the same version: during a rollout, the old pods about to be
          # removed would otherwise attract the new ones to the same node.
          matchLabelKeys: ["pod-template-hash"]
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
        # gunicorn listens on port 80: allow it without root.
        sysctls:
          - name: net.ipv4.ip_unprivileged_port_start
            value: "0"
      containers:
        - name: poll
          image: poll
          env:
            # The user has no home directory, and gunicorn writes its control socket under $HOME.
            - name: HOME
              value: /tmp
            # The image runs a single synchronous gunicorn worker: any connection that does not
            # send its request at once (load balancer TCP probes, scanners, browser preconnects)
            # blocks it, and the probes time out. Threaded workers serve the other requests meanwhile.
            - name: GUNICORN_CMD_ARGS
              value: --workers 2 --threads 4
            - name: REDIS_HOST
              value: redis
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis
                  key: password
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          lifecycle:
            # Keep serving while the load balancer stops sending traffic to this pod.
            preStop:
              exec:
                command: ["sleep", "5"]
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 500m
              memory: 192Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            # gunicorn needs a writable directory for its worker heartbeat files.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
