apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The `postgres` Secret (key `password`) comes from scripts/render.sh and POSTGRES_PASSWORD.
resources:
  - statefulset.yaml
  - service.yaml

configMapGenerator:
  # Connection settings shared by PostgreSQL, the worker and result (everything but the password).
  # The name gets a content hash: changing a value rolls out the pods that use it.
  - name: postgres
    literals:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=poll
      - POSTGRES_USER=poll
