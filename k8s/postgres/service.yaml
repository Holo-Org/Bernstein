apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  # Headless: required by the StatefulSet, and `postgres` resolves directly to the pod
  # (only once it is ready). Exposed inside the cluster only.
  clusterIP: None
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
